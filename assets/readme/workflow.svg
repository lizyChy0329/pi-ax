<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="30" y="30" fill="#9ca3af" font-size="12" font-weight="600" letter-spacing="1.5">EXTRACTION WORKFLOW</text>

  <!-- Step 1: Outline -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="190" height="130" rx="10" fill="#11111a" stroke="#2a2a3e" stroke-width="1"/>
    <text x="16" y="28" fill="#8b5cf6" font-size="13" font-weight="700">① DISCOVER</text>
    <text x="16" y="50" fill="#e4e4e7" font-size="14">outline</text>
    <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#9ca3af" transform="translate(16, 66)">
      <text x="0" y="0">$ ax --outline</text>
      <text x="0" y="16">210 path</text>
      <text x="0" y="32"> 90 li</text>
      <text x="0" y="48"> 82 a.Link</text>
      <text x="0" y="64"> 37 li.item</text>
    </g>
  </g>

  <!-- Arrow -->
  <line x1="225" y1="125" x2="265" y2="125" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Inspect -->
  <g transform="translate(270, 60)">
    <rect x="0" y="0" width="190" height="130" rx="10" fill="#11111a" stroke="#2a2a3e" stroke-width="1"/>
    <text x="16" y="28" fill="#8b5cf6" font-size="13" font-weight="700">② INSPECT</text>
    <text x="16" y="50" fill="#e4e4e7" font-size="14">locate</text>
    <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#9ca3af" transform="translate(16, 66)">
      <text x="0" y="0">$ ax --locate</text>
      <text x="0" y="16">  'Pricing'</text>
      <text x="0" y="32">→ .nav-pricing</text>
      <text x="0" y="48">→ li.item[data-</text>
      <text x="0" y="64">  price]</text>
    </g>
  </g>

  <line x1="465" y1="125" x2="505" y2="125" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Extract -->
  <g transform="translate(510, 60)">
    <rect x="0" y="0" width="190" height="130" rx="10" fill="#11111a" stroke="#2a2a3e" stroke-width="1"/>
    <text x="16" y="28" fill="#8b5cf6" font-size="13" font-weight="700">③ EXTRACT</text>
    <text x="16" y="50" fill="#e4e4e7" font-size="14">extract</text>
    <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#9ca3af" transform="translate(16, 66)">
      <text x="0" y="0">selector: ".item"</text>
      <text x="0" y="16">fields: "name=a,</text>
      <text x="0" y="32">  price=.price"</text>
      <text x="0" y="48">→ name  price</text>
      <text x="0" y="64">  Widget $9.99</text>
    </g>
  </g>

  <line x1="705" y1="125" x2="745" y2="125" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Continue -->
  <g transform="translate(750, 60)">
    <rect x="0" y="0" width="200" height="130" rx="10" fill="#11111a" stroke="#2a2a3e" stroke-width="1"/>
    <text x="16" y="28" fill="#8b5cf6" font-size="13" font-weight="700">④ CONTINUE</text>
    <text x="16" y="50" fill="#e4e4e7" font-size="14">pagination</text>
    <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#9ca3af" transform="translate(16, 66)">
      <text x="0" y="0">--json-envelope</text>
      <text x="0" y="16">{"state":"more",</text>
      <text x="0" y="32"> "next":50}</text>
      <text x="0" y="48">→ --offset 50</text>
      <text x="0" y="64">state: "complete"</text>
    </g>
  </g>

  <line x1="955" y1="125" x2="995" y2="125" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output -->
  <g transform="translate(1000, 60)">
    <rect x="0" y="0" width="170" height="130" rx="10" fill="#11111a" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="16" y="28" fill="#8b5cf6" font-size="13" font-weight="700">✓ OUTPUT</text>
    <text x="16" y="50" fill="#e4e4e7" font-size="14">Structured</text>
    <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#9ca3af" transform="translate(16, 66)">
      <text x="0" y="0">TSV / JSON</text>
      <text x="0" y="16">50 rows max</text>
      <text x="0" y="32">~2min cache</text>
      <text x="0" y="48">Fresh: --fresh</text>
    </g>
  </g>
</svg>

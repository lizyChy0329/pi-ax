name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号：patch / minor / major 或具体版本（如 1.2.3），默认 patch'
        required: false
        default: 'patch'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # 仅用于 npm provenance 签名（认证走 NPM_TOKEN）
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # checkout 后可能处于 detached HEAD，bumpp 的 git push 需要真实分支和 upstream
      - run: |
          git checkout main
          git branch --set-upstream-to=origin/main main

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Bump version & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run release -- --release "${{ github.event.inputs.version }}" -y

      # 经典 NPM_TOKEN 方案：setup-node 生成的 .npmrc 读取 NODE_AUTH_TOKEN
      - name: Publish to npm
        run: npm run publish:npm -- --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "Release v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}